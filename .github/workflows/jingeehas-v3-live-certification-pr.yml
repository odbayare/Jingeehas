name: Jingeehas V3 Live Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - ops-smoke-trigger/jingeehas-v3-live-certification.txt

permissions:
  contents: read

concurrency:
  group: jingeehas-v3-live-certification
  cancel-in-progress: true

jobs:
  certify-live-v3:
    name: Build main candidate and certify exact live V3 package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact production candidate
        run: npm run build:production

      - name: Verify exact V3 candidate is live
        env:
          JINGEEHAS_LIVE_ORIGIN: https://jingeehas.fit
          JINGEEHAS_EXPECTED_MANIFEST_PATH: dist/production-package-manifest.json
          JINGEEHAS_EXPECTED_QUESTIONNAIRE_VERSION: jingeehas-production-2026-08-v3-routing-safety
          LIVE_SMOKE_ATTEMPTS: 4
          LIVE_SMOKE_DELAY_MS: 10000
          LIVE_SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node tools/verify-live-production.mjs

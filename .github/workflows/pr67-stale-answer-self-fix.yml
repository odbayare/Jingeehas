name: PR67 stale-answer self-fix

on:
  push:
    branches:
      - codex/v5-sequential-navigation-hotfix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v5-sequential-navigation-hotfix
      - name: Apply stale-answer patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          old = base64.b64decode("").decode("utf-8")
          new = base64.b64decode("").decode("utf-8")
          test_block = base64.b64decode("").decode("utf-8")
          app = Path("app.js")
          text = app.read_text(encoding="utf-8")
          if old not in text:
              raise SystemExit("app.js patch anchor not found")
          app.write_text(text.replace(old, new, 1), encoding="utf-8")
          spec = Path("tests/e2e/v5-virtual-users.spec.js")
          source = spec.read_text(encoding="utf-8")
          if "V5 conditional maintenance answers do not resurrect after Back changes" in source:
              raise SystemExit("regression test already present")
          spec.write_text(source + test_block, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/pr67-stale-answer-self-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/e2e/v5-virtual-users.spec.js
          git commit -m "[pr67-stale-fix] Reconcile cleared conditional answers"
          git push origin HEAD:codex/v5-sequential-navigation-hotfix

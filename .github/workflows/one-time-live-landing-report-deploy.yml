name: Finalize landing E2E expectations

on:
  push:
    branches:
      - agent/full-landing-copy-and-direct-payment-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Commit landing E2E expectations'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-landing-copy-and-direct-payment-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update E2E expectations to approved landing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/product-flow.spec.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'await expect(page.getByRole("heading", { name: "Тайлангийн жишээ", exact: true })).toHaveCount(1);': 'await expect(page.getByRole("heading", { name: "Жин хасахад юу саад болж байгааг төдийгүй, яаж зохицуулахаа мэднэ", exact: true })).toHaveCount(1);',
              'await expect(page.getByText("Доорх нь нэргүй жишээ. Энэ нь таны үр дүн биш; тайлангийн нарийвчлал, бүтэц, хэлбэрийг урьдчилж харуулж байна.", { exact: true })).toHaveCount(1);': 'await expect(page.getByText(/хэмнэл алдагдсан үед эргэн орох аргыг/)).toHaveCount(1);'
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one E2E assertion match, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit E2E expectation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/product-flow.spec.js
          git commit -m 'Align landing E2E with report value copy'
          git push origin HEAD:agent/full-landing-copy-and-direct-payment-v2

      - name: Validate JavaScript
        run: node --check app.js

      - name: Run unit tests
        run: npm test

      - name: Run contract tests
        run: npm run test:contracts

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Verify packages
        run: |
          npm run verify:production-package
          npm run verify:staging-package
          npm run build:production

      - name: Remove temporary automation after green certification
        run: |
          rm .github/workflows/one-time-live-landing-report-deploy.yml
          rm .github/landing-report-deploy-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-live-landing-report-deploy.yml .github/landing-report-deploy-trigger.txt
          git commit -m 'Remove temporary landing finalization automation'
          git push origin HEAD:agent/full-landing-copy-and-direct-payment-v2

name: Finalize landing report source and tests

on:
  push:
    branches:
      - agent/full-landing-copy-and-direct-payment-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize landing report source and tests'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-landing-copy-and-direct-payment-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize approved landing copy and regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          old = 'Таны тайлан зөвхөн асуудлыг нэрлээд орхихгүй. Таны хариултад тулгуурлан хамгийн түрүүнд анхаарах чиглэл, өдөр тутам хэрэгжүүлж болох алхам болон төлөвлөгөө тасарсан үед эргэн орох аргыг гаргаж өгнө.'
          new = 'Таны тайлан зөвхөн асуудлыг нэрлээд орхихгүй. Таны хариултад тулгуурлан хамгийн түрүүнд анхаарах чиглэл, өдөр тутам хэрэгжүүлж болох алхам болон хэмнэл алдагдсан үед эргэн орох аргыг гаргаж өгнө.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one landing intro match, found {text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/question-bank.test.js')
          source = test.read_text(encoding='utf-8')
          replacements = {
              'assert(landing.includes("Нэргүй жишээ"));': 'assert(landing.includes("Таны хувийн тайлан"));',
              'assert.equal((landing.match(/Тайлангийн жишээ/g) || []).length, 1);': 'assert.equal((landing.match(/Жин хасахад юу саад болж байгааг төдийгүй, яаж зохицуулахаа мэднэ/g) || []).length, 1);',
              'assert(landing.includes("Доорх нь нэргүй жишээ. Энэ нь таны үр дүн биш; тайлангийн нарийвчлал, бүтэц, хэлбэрийг урьдчилж харуулж байна."));': 'assert(landing.includes("хэмнэл алдагдсан үед эргэн орох аргыг"));',
              'assert(landing.includes("өлссөндөө гэхээсээ илүү ачааллаа буулгах гэж иддэг бололтой"));': 'assert(landing.includes("ЯАЖ ЗОХИЦУУЛАХ ВЭ?"));',
              'assert(landing.includes("зураг өөрөө гарч ирдэг"));': 'assert(landing.includes("ТӨЛӨВЛӨГӨӨ ТАСАРВАЛ ЯАХ ВЭ?"));',
              'assert(landing.includes("Юу саад болоод байгаагаа мэдчихвэл ажил хөнгөрдөг"));': 'assert(landing.includes("Юу саад болж байгааг ойлгоод, яаж зохицуулахаа мэдвэл ажил хөнгөрдөг"));'
          }
          for old_line, new_line in replacements.items():
              count = source.count(old_line)
              if old_line == 'assert(landing.includes("зураг өөрөө гарч ирдэг"));':
                  if count != 2:
                      raise SystemExit(f'Expected two legacy picture assertions, found {count}')
                  source = source.replace(old_line, new_line, 1)
                  source = source.replace(old_line, 'assert(!landing.includes("ГОЛ ЗУРШИЛ — Стрессээ хоолоор дардаг"));', 1)
                  continue
              if count != 1:
                  raise SystemExit(f'Expected one assertion match, found {count}: {old_line}')
              source = source.replace(old_line, new_line)
          test.write_text(source, encoding='utf-8')
          PY

      - name: Validate exact landing content
        run: |
          node --check app.js
          grep -F 'Жин хасахад юу саад болж байгааг төдийгүй, яаж зохицуулахаа мэднэ' app.js
          grep -F 'ЯАЖ ЗОХИЦУУЛАХ ВЭ?' app.js
          grep -F 'ТӨЛӨВЛӨГӨӨ ТАСАРВАЛ ЯАХ ВЭ?' app.js
          grep -F 'хэмнэл алдагдсан үед эргэн орох аргыг' app.js
          ! grep -F 'ГОЛ ЗУРШИЛ — Стрессээ хоолоор дардаг' app.js
          ! grep -F 'төлөвлөгөө тасарсан' app.js

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Run complete validation
        run: |
          npm test
          npm run test:contracts
          npm run test:e2e

      - name: Refresh and verify deterministic packages
        run: |
          npm run generate:artifacts
          npm run build:staging
          npm run verify:production-package
          npm run verify:staging-package
          npm run build:production

      - name: Commit finalized source and remove temporary automation
        run: |
          rm .github/workflows/one-time-live-landing-report-deploy.yml
          rm .github/landing-report-deploy-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js tests/question-bank.test.js artifacts/production-package-manifest.json artifacts/staging-package-manifest.json .github/workflows/one-time-live-landing-report-deploy.yml .github/landing-report-deploy-trigger.txt
          git commit -m 'Finalize landing report value copy'
          git push origin HEAD:agent/full-landing-copy-and-direct-payment-v2

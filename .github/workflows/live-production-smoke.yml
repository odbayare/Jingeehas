name: Live production smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live Jingeehas production
        run: node tools/verify-live-production.mjs
        env:
          JINGEEHAS_LIVE_ORIGIN: https://jingeehas.fit
          LIVE_SMOKE_ATTEMPTS: ${{ github.event_name == 'push' && '20' || '3' }}
          LIVE_SMOKE_DELAY_MS: ${{ github.event_name == 'push' && '15000' || '5000' }}
          LIVE_SMOKE_REQUEST_TIMEOUT_MS: 8000

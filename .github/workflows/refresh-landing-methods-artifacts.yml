name: Refresh landing methods artifacts

on:
  push:
    branches:
      - agent/full-landing-copy-and-direct-payment-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-landing-copy-and-direct-payment-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check assets/landing-scientific-methods.js
      - run: npm test
      - run: npm run generate:artifacts
      - run: npm run build:staging
      - name: Commit generated manifests and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-landing-methods-artifacts.yml
          git add artifacts/production-package-manifest.json artifacts/staging-package-manifest.json
          git commit -m "Refresh landing methods package manifests"
          git push origin HEAD:agent/full-landing-copy-and-direct-payment-v2

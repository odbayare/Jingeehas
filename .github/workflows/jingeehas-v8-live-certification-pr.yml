name: Jingeehas V8 Live Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - ops-smoke-trigger/jingeehas-v8-live-certification.txt

permissions:
  contents: read

concurrency:
  group: jingeehas-v8-live-certification
  cancel-in-progress: true

jobs:
  certify-live-v8:
    name: Build main candidate and certify exact live V8 package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact production candidate
        run: npm run build:production

      - name: Verify local V8 release markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'jingeehas-case-formulation-v8-editorial-polish' .generated-copy-hotfix/netlify/functions/_lib/report.js
          grep -q 'ХЭВ МАЯГ БҮРТ ЯАЖ ХАНДАХ ВЭ?' dist/app.js
          grep -q 'function renderEditorialResultOverviewV8' dist/app.js
          grep -q 'Дараагийн алхамд өдөр тутмын нэг үйл явдалтай холбосон богино хөдөлгөөнийг сонгоорой.' .generated-copy-hotfix/netlify/functions/_lib/report.js
          grep -q 'function buildLegacyReportSectionsV6' dist/app.js
          grep -q 'jingeehas-case-formulation-v7-semantic-builder' dist/app.js

      - name: Verify exact V8 candidate is live
        env:
          JINGEEHAS_LIVE_ORIGIN: https://jingeehas.fit
          JINGEEHAS_EXPECTED_MANIFEST_PATH: dist/production-package-manifest.json
          JINGEEHAS_EXPECTED_QUESTIONNAIRE_VERSION: jingeehas-production-2026-08-v3-routing-safety
          LIVE_SMOKE_ATTEMPTS: 24
          LIVE_SMOKE_DELAY_MS: 15000
          LIVE_SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node tools/verify-live-production.mjs

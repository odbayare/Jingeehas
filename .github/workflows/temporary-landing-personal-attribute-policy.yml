name: Temporary landing personal-attribute policy transaction

on:
  push:
    branches:
      - agent/landing-personal-attribute-policy-v1
    paths:
      - "app.js"
      - "tests/**"
      - "tools/apply-landing-personal-attribute-policy.mjs"
      - ".github/workflows/temporary-landing-personal-attribute-policy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.js"
      - "tests/**"
      - "tools/apply-landing-personal-attribute-policy.mjs"
      - ".github/workflows/temporary-landing-personal-attribute-policy.yml"

permissions:
  contents: write

concurrency:
  group: landing-personal-attribute-policy-v1
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-personal-attribute-policy-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply exact renderer and test replacements
        run: node tools/apply-landing-personal-attribute-policy.mjs
      - name: Validate renderer and full repository gates
        run: |
          node --check app.js
          npm test
          npm run test:e2e
          npm run test:contracts
          npm run generate:artifacts
          npm run verify:production-package
          npm run build:staging
          npm run verify:staging-package
          git diff --check
      - name: Commit validated generated changes
        run: |
          if git diff --quiet; then
            echo "No validated source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests artifacts/production-package-manifest.json artifacts/staging-package-manifest.json
          git commit -m "Make landing hero policy-safe for Meta review"
          git push origin HEAD:agent/landing-personal-attribute-policy-v1

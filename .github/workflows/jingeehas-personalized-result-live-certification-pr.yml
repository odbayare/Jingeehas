name: Jingeehas Personalized Result Live Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - ops-smoke-trigger/jingeehas-personalized-result-live-certification.txt

permissions:
  contents: read

concurrency:
  group: jingeehas-personalized-result-live-certification
  cancel-in-progress: true

jobs:
  certify-live-personalized-result:
    name: Build main candidate and certify exact personalized-result package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact production candidate
        run: npm run build:production

      - name: Verify personalized result contracts
        run: |
          node tests/post-assessment-paywall-flow.test.js
          node tests/post-assessment-personalized-result-runtime.test.js

      - name: Verify local release markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'jingeehas-initial-result-v2-count-only' .generated-copy-hotfix/netlify/functions/_lib/initial-result.js
          grep -q 'async function loadInitialResult()' dist/app.js
          grep -q 'weight-assessment-initial-result?assessmentId=' dist/app.js
          grep -q 'Таны тайланд .* хэв маяг илэрлээ' dist/app.js
          grep -q 'чухал уялдаа холбоо' dist/app.js
          grep -q 'батлагдсан хүчтэй давхцал илрээгүй' dist/app.js
          grep -q 'Таны тайланд хүчтэй давамгай нэг хэв маяг илрээгүй' dist/app.js
          grep -q 'retry-initial-result' dist/app.js
          grep -q 'jingeehas-case-formulation-v8-editorial-polish' .generated-copy-hotfix/netlify/functions/_lib/report.js

      - name: Verify exact candidate is live
        env:
          JINGEEHAS_LIVE_ORIGIN: https://jingeehas.fit
          JINGEEHAS_EXPECTED_MANIFEST_PATH: dist/production-package-manifest.json
          JINGEEHAS_EXPECTED_QUESTIONNAIRE_VERSION: jingeehas-production-2026-08-v3-routing-safety
          LIVE_SMOKE_ATTEMPTS: 24
          LIVE_SMOKE_DELAY_MS: 15000
          LIVE_SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node tools/verify-live-production.mjs
